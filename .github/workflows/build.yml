name: Test, build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  # Typst is a large dependency; keep compilation within hosted runner memory.
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Rust stable
        run: rustup update stable --no-self-update
      - name: Select Rust stable
        run: rustup default stable
      - name: Cache Rust dependencies and compiled artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          key: ${{ matrix.platform }}-release
      - name: Validate version and release tag
        run: node scripts/version.mjs
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --version=6.7.3 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Build frontend for embedded assets
        # npm run build already runs the TypeScript checker.
        run: npm --prefix frontend run build
      - name: Test Rust library and binaries
        # Match the packaging profile so dependencies (especially Typst) are reused.
        # Test harnesses still need their own compilation/linking.
        run: cargo test --locked --release --manifest-path backend/Cargo.toml --all-targets
      - name: Build Windows binaries and installer
        if: runner.os == 'Windows'
        shell: cmd
        env:
          SOROBO_FRONTEND_READY: '1'
        run: build.cmd
      - name: Download the last setup from before the rename
        # The program was called Sqonto until version 0.10; the installer test also upgrades
        # such an installation.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.10.0 --repo "${{ github.repository }}" --pattern 'Sqonto-0.10.0-windows-x64-setup.exe' --dir dist/previous
      - name: Test Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installer.ps1 -PreviousInstaller dist/previous/Sqonto-0.10.0-windows-x64-setup.exe
      - name: Package Windows portable binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node scripts/version.mjs
          Compress-Archive -Path dist/Sorobo.exe, dist/sorobo-server.exe, dist/LICENSE.txt, dist/THIRD-PARTY-LICENSES.txt -DestinationPath "dist/packages/Sorobo-$version-windows-x64-portable.zip"
      - name: Package Windows binaries for installations from before the rename
        # Versions until 0.10 (Sqonto) look for Sqonto-<version>-… packages and replace the
        # programs under their former names. Keep this for a few releases after the rename;
        # backend/src/services/update.rs reads both names.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node scripts/version.mjs
          Copy-Item "dist/packages/Sorobo-$version-windows-x64-setup.exe" "dist/packages/Sqonto-$version-windows-x64-setup.exe"
          $legacy = (New-Item -ItemType Directory -Force dist/legacy).FullName
          Copy-Item dist/Sorobo.exe "$legacy/Sqonto.exe"
          Copy-Item dist/sorobo-server.exe "$legacy/sqonto-server.exe"
          Copy-Item dist/LICENSE.txt, dist/THIRD-PARTY-LICENSES.txt $legacy
          Compress-Archive -Path "$legacy/Sqonto.exe", "$legacy/sqonto-server.exe", "$legacy/LICENSE.txt", "$legacy/THIRD-PARTY-LICENSES.txt" -DestinationPath "dist/packages/Sqonto-$version-windows-x64-portable.zip"
      - name: Build and package Unix binaries
        if: runner.os != 'Windows'
        env:
          SOROBO_FRONTEND_READY: '1'
        run: sh build.sh
      - name: Package Unix binaries for installations from before the rename
        # See the Windows step above.
        if: runner.os != 'Windows'
        run: |
          version=$(node scripts/version.mjs)
          platform=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          mkdir -p dist/legacy
          cp dist/sorobo dist/legacy/sqonto
          cp dist/sorobo-server dist/legacy/sqonto-server
          cp dist/LICENSE.txt dist/THIRD-PARTY-LICENSES.txt dist/legacy/
          tar -czf "dist/packages/Sqonto-$version-$platform-$arch.tar.gz" -C dist/legacy sqonto sqonto-server LICENSE.txt THIRD-PARTY-LICENSES.txt
      - name: Test server-only configuration
        # Feature changes require some distinct artifacts. Check this once, after
        # packaging, so it cannot replace the binaries being shipped.
        if: runner.os == 'Linux'
        run: cargo test --locked --release --manifest-path backend/Cargo.toml --no-default-features --lib --bin sorobo-server
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Create checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          sha256sum -- * > SHA256SUMS.txt
          # A failed upload leaves a draft; publish only after all assets are present.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Sorobo $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber -- *
          gh release edit "$RELEASE_TAG" --draft=false
